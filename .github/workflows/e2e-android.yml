name: E2E (Android)

# The full NDK + emulator run takes ~30-45 minutes, so this is manual-dispatch
# rather than per-PR. Trigger it from the Actions tab before releases.
on:
  workflow_dispatch:
    inputs:
      include_tags:
        description: 'Only run flows with these tags (comma-separated, empty = all non-picker flows)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-android:
    name: Maestro on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAESTRO_VERSION: '2.6.0'

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Build example app (release, x86_64)
        working-directory: example/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --console=plain

      - name: Run Maestro flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install example/android/app/build/outputs/apk/release/app-release.apk
            if [ -n "${{ inputs.include_tags }}" ]; then
              maestro test --include-tags "${{ inputs.include_tags }}" --debug-output maestro-debug example/.maestro
            else
              maestro test --exclude-tags picker --debug-output maestro-debug example/.maestro
            fi

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-output
          path: maestro-debug
          if-no-files-found: ignore
